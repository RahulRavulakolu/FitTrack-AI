name: fittrack

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  mongo:
    image: mongo:7.0.24
    restart: unless-stopped
    command: [mongod, --wiredTigerCacheSizeGB, '0.25']
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Generate the server .env first}
      MONGO_INITDB_DATABASE: fittrack
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Generate the server .env first}
    volumes:
      - mongo-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/fittrack.js:ro
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1g
    logging: *logging

  ollama:
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '4096'
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 5g
    logging: *logging

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    # Ollama stays on loopback, reachable only inside this shared namespace.
    # Caddy reaches the API on ollama:4000; neither port is published to the VM.
    network_mode: service:ollama
    depends_on:
      mongo:
        condition: service_healthy
      ollama:
        condition: service_healthy
        restart: true
    environment:
      NODE_ENV: production
      PORT: '4000'
      TRUST_PROXY: '1'
      APP_ORIGIN: https://${FITTRACK_DOMAIN:?Set the public hostname}
      MONGODB_URI: mongodb://fittrack:${MONGO_APP_PASSWORD:?Generate the server .env first}@mongo:27017/fittrack?authSource=fittrack
      LOCAL_UPLOADS_ENABLED: 'true'
      LOCAL_AI_ENABLED: 'true'
      OLLAMA_URL: http://127.0.0.1:11434
      OLLAMA_VISION_MODEL: qwen3-vl:2b-instruct
      OLLAMA_TEXT_MODEL: qwen3-vl:2b-instruct
      SMTP_HOST: ${SMTP_HOST:?Configure password-reset email}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Configure SMTP authentication}
      SMTP_PASS: ${SMTP_PASS:?Configure SMTP authentication}
      SMTP_FROM: ${SMTP_FROM:?Configure a verified sender}
    volumes:
      - uploads:/app/.data/uploads
    read_only: true
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    logging: *logging

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      FITTRACK_DOMAIN: ${FITTRACK_DOMAIN:?Set the public hostname}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 256m
    logging: *logging

volumes:
  mongo-data:
  uploads:
  ollama-data:
  caddy-data:
  caddy-config:
