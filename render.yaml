services:
  - type: web
    name: fittrack-ai
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: TRUST_PROXY
        value: 1
      - key: APP_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      # This small hosted web service does not run a local LLM. Host Ollama
      # alongside the API on hardware you control to enable free local AI.
      - key: LOCAL_AI_ENABLED
        value: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
